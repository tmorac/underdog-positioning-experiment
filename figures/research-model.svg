    <rect x="195" y="20" width="164" height="62"/>
    <rect x="405" y="97" width="164" height="64"/>
    <rect x="405" y="179" width="164" height="68"/>
    <rect x="405" y="265" width="164" height="70"/>
    <rect x="405" y="353" width="164" height="70"/>
    <rect x="20" y="226" width="146" height="64"/>
    <rect x="738" y="222" width="164" height="70"/>

    <!-- X to mediators -->
    <line x1="166" y1="258" x2="405" y2="129" marker-end="url(#arrow)"/>
    <line x1="166" y1="258" x2="405" y2="213" marker-end="url(#arrow)"/>
    <line x1="166" y1="258" x2="405" y2="300" marker-end="url(#arrow)"/>
    <line x1="166" y1="258" x2="405" y2="388" marker-end="url(#arrow)"/>

    <!-- mediators to Y -->
    <line x1="569" y1="129" x2="738" y2="257" marker-end="url(#arrow)"/>
    <line x1="569" y1="213" x2="738" y2="257" marker-end="url(#arrow)"/>
    <line x1="569" y1="300" x2="738" y2="257" marker-end="url(#arrow)"/>
    <line x1="569" y1="388" x2="738" y2="257" marker-end="url(#arrow)"/>

    <!-- humour moderates the X to M paths -->
    <line x1="277" y1="82" x2="277" y2="198" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="277" y1="198" x2="277" y2="237" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="277" y1="237" x2="277" y2="277" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="277" y1="277" x2="277" y2="318" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- labels -->
  <g text-anchor="middle">
