      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>

  <g fill="none" stroke="#1a1a1a" stroke-width="1.2">
