    <text x="487" y="289">Product design</text>
    <text x="487" y="306">Aesthetics</text>
    <text x="487" y="323">[M2b]</text>

    <text x="487" y="377">Product design</text>
    <text x="487" y="394">Functionality</text>
    <text x="487" y="411">[M2c]</text>

    <text x="93" y="254">Underdog positioning</text>
    <text x="93" y="272">(vs. incumbent) [X]</text>

    <text x="820" y="262">Purchase intention [Y]</text>
